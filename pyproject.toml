[project]
name = "kognit"
version = "0.1.0"
description = "KOGNIT - AI-powered academic knowledge assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "python-dotenv",
    "langgraph",
    "langchain-core",
    "langchain-text-splitters",
    "langsmith",
    "groq",
    "qdrant-client",
    "fastembed",
    "sentence-transformers",
    "transformers",
    "torch",
    "pymupdf",
    "tavily-python",
    "numpy",
    "scikit-learn",
    "psycopg[binary]",
    "sqlalchemy",
    "redis",
    "streamlit",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.3.0",
]


[tool.uv]

package = false


[tool.pytest.ini_options]
pythonpath = [
    "."
]
