version: "3.8"

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kognit-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./storage/qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    container_name: kognit-postgres
    environment:
      POSTGRES_USER: kognit_admin
      POSTGRES_PASSWORD: kognit_password
      POSTGRES_DB: kognit_db
    ports:
      - "5432:5432"
    volumes:
      - ./storage/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kognit-redis
    ports:
      - "6379:6379"