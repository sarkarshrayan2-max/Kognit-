services:

  postgres:
    image: postgres:17
    container_name: kognit-postgres
    environment:
      POSTGRES_DB: kognit_db
      POSTGRES_USER: kognit_admin
      POSTGRES_PASSWORD: kognit_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kognit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kognit-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kognit-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface 
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      HF_HUB_DISABLE_XET: "1"
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  huggingface_cache: